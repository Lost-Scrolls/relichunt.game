<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Relic Hunt — Your relic is waiting.</title>
<link rel="icon" type="image/webp" href="assets/logo-gold-helm.webp"/>
<link rel="apple-touch-icon" href="assets/logo-gold-helm.webp"/>
<link rel="stylesheet" href="colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: #0B0716; color: #FBF5FF; }
  html { scroll-behavior: smooth; overflow-x: hidden; }
  * { box-sizing: border-box; }
  body { font-family: 'Onest', sans-serif; }

  @keyframes twinkle {
    from { opacity: 0.15; }
    to   { opacity: 0.8; }
  }
  @keyframes heroReveal {
    from { opacity: 0; transform: translateX(-50%) translateY(40px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  @keyframes floatItem {
    from { transform: translateY(-4px) rotate(-3deg); }
    to   { transform: translateY(4px) rotate(3deg); }
  }
  @keyframes slowSpin {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to   { transform: translate(-50%, -50%) rotate(360deg); }
  }
  @keyframes revealUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .fade-in-up { animation: revealUp 900ms cubic-bezier(.16,1,.3,1) both; }

  /* responsive tweaks */
  @media (max-width: 900px) {
    .hero-split-grid { grid-template-columns: 1fr !important; }
    .tg-grid { grid-template-columns: 1fr !important; gap: 60px !important; }
    .heroes-grid { grid-template-columns: 1fr !important; }
    .rarity-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .nav-items { display: none !important; }
    .hero-char-left, .hero-char-right { opacity: 0.35 !important; }
  }

  /* Tweaks panel */
  .tweaks-panel {
    position: fixed; right: 20px; bottom: 20px; z-index: 1000;
    background: rgba(11,7,22,0.92); backdrop-filter: blur(20px);
    border: 1px solid rgba(251,191,26,0.35); border-radius: 16px;
    padding: 16px; width: 260px;
    box-shadow: 0 20px 48px rgba(0,0,0,0.7), 0 0 30px rgba(251,191,26,0.15);
    font-family: 'Onest', sans-serif;
    display: none;
  }
  .tweaks-panel.open { display: block; animation: revealUp 300ms cubic-bezier(.16,1,.3,1); }
  .tweaks-title {
    font-family: 'Cinzel', serif; font-weight: 800; font-size: 12px;
    letter-spacing: 0.24em; text-transform: uppercase; color: #FBBF1A;
    margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
  }
  .tweak-label {
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    color: #9F90B8; font-weight: 700; margin-bottom: 8px;
  }
  .tweak-options { display: flex; gap: 6px; flex-wrap: wrap; }
  .tweak-opt {
    flex: 1; min-width: 60px; padding: 8px 10px; border-radius: 8px;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    background: rgba(232,220,255,0.05); color: #D7CAE6; cursor: pointer;
    border: 1px solid rgba(232,220,255,0.12); transition: all 180ms;
  }
  .tweak-opt.active {
    background: linear-gradient(135deg, rgba(242,90,6,0.25), rgba(251,191,26,0.15));
    color: #FBBF1A; border-color: rgba(251,191,26,0.5);
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components/Nav.jsx"></script>
<script type="text/babel" src="components/Hero.jsx"></script>
<script type="text/babel" src="components/TelegramSection.jsx"></script>
<script type="text/babel" src="components/LootSection.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "heroLayout": "center"
}/*EDITMODE-END*/;

function TweaksPanel({ open, values, onChange }) {
  if (!open) return null;
  return (
    <div className="tweaks-panel open">
      <div className="tweaks-title">✦ Tweaks</div>
      <div className="tweak-label">Hero Layout</div>
      <div className="tweak-options">
        {['center', 'left', 'split'].map(v => (
          <div key={v}
            className={'tweak-opt' + (values.heroLayout === v ? ' active' : '')}
            onClick={() => onChange({ heroLayout: v })}>
            {v}
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
  const [tweaksOpen, setTweaksOpen] = React.useState(false);

  React.useEffect(() => {
    const onMsg = (e) => {
      if (!e.data || typeof e.data !== 'object') return;
      if (e.data.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const updateTweaks = (edits) => {
    setTweaks(t => ({ ...t, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  };

  return (
    <>
      <Nav/>
      <Hero layout={tweaks.heroLayout}/>
      <TelegramSection/>
      <LootSection/>
      <CtaSection/>
      <Footer/>
      <TweaksPanel open={tweaksOpen} values={tweaks} onChange={updateTweaks}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
